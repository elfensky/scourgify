name: CI

# Runs the plain-assert core tests on every push/PR to develop (the integration
# branch) or main (the release branch), across the requires-python floor and the
# current release — turning the pyproject `requires-python = ">=3.10"` claim into
# an enforced fact. (No lint leg: scourgify ships no ruff config or dev deps — the
# tests are the gate.)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # requires-python floor + current + the one Calibre actually bundles. 3.14 is not
        # speculative future-proofing: Calibre 9.11 ships Python 3.14.6 (measured 2026-08-06),
        # so the plugin's interpreter is NEWER than this repo's, not older as was assumed.
        python-version: ["3.10", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --locked

      - name: Tests
        run: |  # every test file — a new tests/test_*.py is in CI by existing (bash -e: first failure aborts)
          for t in tests/test_*.py; do uv run "$t"; done
